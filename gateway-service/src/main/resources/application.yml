server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: account-service-rest
          uri: ${ACCOUNT_SERVICE_URI:lb://account-service}
          predicates:
            - Path=/api/accounts/**
        - id: account-service-graphql
          uri: ${ACCOUNT_SERVICE_URI:lb://account-service}
          predicates:
            - Path=/accounts/graphql
          filters:
            - RewritePath=/accounts/graphql, /graphql
        - id: transaction-service-rest
          uri: ${TRANSACTION_SERVICE_URI:lb://transaction-service}
          predicates:
            - Path=/api/transactions/**
        - id: transaction-service-graphql
          uri: ${TRANSACTION_SERVICE_URI:lb://transaction-service}
          predicates:
            - Path=/transactions/graphql
          filters:
            - RewritePath=/transactions/graphql, /graphql
        - id: chat-bot-service-rest
          uri: ${CHAT_BOT_SERVICE_URI:lb://chat-bot-service}
          predicates:
            - Path=/api/chat/**

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}