server:
  port: 8082

spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:h2:mem:transactiondb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${TRANSACTION_DB_USER:bank}
    password: ${TRANSACTION_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

bank:
  transaction:
    max-amount: 1000

clients:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
