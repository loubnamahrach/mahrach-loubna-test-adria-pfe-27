server:
  port: 8082

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:h2:mem:transactiondb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${TRANSACTION_DB_USER:bank}
    password: ${TRANSACTION_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    mcp:
      server:
        name: transaction-service-mcp
        version: 1.0.0
        protocol: STREAMABLE
  graphql:
    graphiql:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        ignoreExceptions:
          - ma.enset.bank.transaction.service.exception.TransactionRuleException
  retry:
    instances:
      accountServiceRead:
        maxAttempts: 2
        waitDuration: 100ms
        retryExceptions:
          - ma.enset.bank.transaction.service.exception.AccountServiceUnavailableException

bank:
  transaction:
    max-amount: 1000

clients:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
