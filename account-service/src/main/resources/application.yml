server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/accountdb}
    username: ${ACCOUNT_DB_USER:bank}
    password: ${ACCOUNT_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    mcp:
      server:
        name: account-service-mcp
        version: 1.0.0
        protocol: STREAMABLE
  graphql:
    graphiql:
      enabled: true
