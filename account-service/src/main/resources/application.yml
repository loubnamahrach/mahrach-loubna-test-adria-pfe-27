server:
  port: 8081

spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:h2:mem:accountdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${ACCOUNT_DB_USER:bank}
    password: ${ACCOUNT_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    mcp:
      server:
        name: account-service-mcp
        version: 1.0.0
        protocol: STREAMABLE
  graphql:
    graphiql:
      enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
